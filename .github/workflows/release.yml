name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"
      platform:
        description: "Build platform"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - windows
          - mac
          - linux
      flavor:
        description: "Build flavor"
        required: true
        default: "global"
        type: choice
        options:
          - global
          - cn
      environment:
        description: "Deployment environment"
        required: true
        default: "production-global"
        type: choice
        options:
          - test
          - production-cn
          - production-global
  pull_request_target:
    branches:
      - main
    types:
      - closed

permissions:
  contents: write

jobs:
  release:
    # Only run for tag push, workflow_dispatch, or PR from release branches
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'release/v'))
    runs-on: ${{ matrix.os }}
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || contains(github.ref, '-test') && 'test' || contains(github.ref, '-cn') && 'production-cn' || 'production-global' }}

    strategy:
      matrix:
        os: ${{ fromJSON(
          github.event_name == 'push' && '["macos-latest", "windows-2022", "ubuntu-latest"]' ||
          github.event_name == 'pull_request_target' && '["macos-latest", "windows-2022", "ubuntu-latest"]' ||
          github.event.inputs.platform == 'all' && '["macos-latest", "windows-2022", "ubuntu-latest"]' ||
          github.event.inputs.platform == 'linux' && '["ubuntu-latest"]' ||
          github.event.inputs.platform == 'windows' && '["windows-2022"]' ||
          github.event.inputs.platform == 'mac' && '["macos-latest"]' ||
          '["macos-latest", "windows-2022", "ubuntu-latest"]'
          ) }}
      fail-fast: false

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}

      - name: Get release tag
        id: get-tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "pull_request_target" ]; then
            # Extract version from branch name (release/v1.0.0 -> v1.0.0)
            BRANCH="${{ github.event.pull_request.head.ref }}"
            echo "tag=${BRANCH#release/}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Determine flavor
        id: flavor
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "flavor=${{ github.event.inputs.flavor }}" >> $GITHUB_OUTPUT
          else
            TAG="${{ steps.get-tag.outputs.tag }}"
            if [[ "$TAG" == *"-cn" ]]; then
              echo "flavor=cn" >> $GITHUB_OUTPUT
            else
              echo "flavor=global" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'

      - name: macos-latest dependencies fix
        if: matrix.os == 'macos-latest'
        run: |
          brew install python-setuptools

      # 使用微软官方 Action 来安装 Visual Studio C++ 构建工具
      - name: Setup Visual Studio
        if: matrix.os == 'windows-2022'
        uses: microsoft/setup-msbuild@v3
        with:
          vs-version: '[17.0,)' # 安装 Visual Studio 2022 或更高版本

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-v1-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile
        env:
          npm_config_msvs_version: 2022

      - name: Switch flavor
        run: pnpm flavor:${{ steps.flavor.outputs.flavor }}

      - name: Set package.json version
        shell: bash
        run: |
          TAG="${{ steps.get-tag.outputs.tag }}"
          VERSION="${TAG#v}"
          VERSION="${VERSION%-cn}"
          VERSION="${VERSION%-global}"
          VERSION="${VERSION%-test}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Build Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get install -y rpm libevdev-dev libxtst-dev libx11-dev libxfixes-dev libwayland-dev
          pnpm build:linux

        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=8192
          MAIN_VITE_MARKETAPI_CLIENT_SECRET: ${{ secrets.MAIN_VITE_MARKETAPI_CLIENT_SECRET }}
          MAIN_VITE_MINERU_API_KEY: ${{ secrets.MAIN_VITE_MINERU_API_KEY }}
          RENDERER_VITE_AIHUBMIX_SECRET: ${{ secrets.RENDERER_VITE_AIHUBMIX_SECRET }}
          RENDERER_VITE_PPIO_APP_SECRET: ${{ secrets.RENDERER_VITE_PPIO_APP_SECRET }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_USER_UI_HOST: ${{ vars.VITE_USER_UI_HOST }}
          VITE_WEB_UI_HOST: ${{ vars.VITE_WEB_UI_HOST }}
          VITE_APP_API_HOST: ${{ vars.VITE_APP_API_HOST }}

      - name: Import Code-Signing Certificates (macOS)
        if: matrix.os == 'macos-latest'
        uses: Apple-Actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.CSC_LINK }}
          p12-password: ${{ secrets.CSC_KEY_PASSWORD }}
          keychain: build
          keychain-password: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Store notarytool credentials profile (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          xcrun notarytool store-credentials "AC_PASSWORD" \
            --apple-id "${{ secrets.APPLE_ID }}" \
            --password "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" \
            --team-id "${{ secrets.APPLE_TEAM_ID }}"

      - name: Build Mac
        if: matrix.os == 'macos-latest'
        timeout-minutes: 90
        run: |
          sudo -H pip install setuptools
          # 解锁 keychain 防止签名卡住
          security unlock-keychain -p "${{ secrets.CSC_KEY_PASSWORD }}" build.keychain-db
          security set-keychain-settings -lut 21600 build.keychain-db
          pnpm build:mac
        env:
          # 新方案：Keychain Profile
          CSC_KEYCHAIN: build.keychain-db
          APPLE_KEYCHAIN_PROFILE: AC_PASSWORD
          # 旧方案（已注释）
          # CSC_IDENTITY_AUTO_DISCOVERY: true
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # 其他环境变量保持不变
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=8192
          MAIN_VITE_MARKETAPI_CLIENT_SECRET: ${{ secrets.MAIN_VITE_MARKETAPI_CLIENT_SECRET }}
          MAIN_VITE_MINERU_API_KEY: ${{ secrets.MAIN_VITE_MINERU_API_KEY }}
          RENDERER_VITE_AIHUBMIX_SECRET: ${{ secrets.RENDERER_VITE_AIHUBMIX_SECRET }}
          RENDERER_VITE_PPIO_APP_SECRET: ${{ secrets.RENDERER_VITE_PPIO_APP_SECRET }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_USER_UI_HOST: ${{ vars.VITE_USER_UI_HOST }}
          VITE_WEB_UI_HOST: ${{ vars.VITE_WEB_UI_HOST }}
          APP_API_HOST: ${{ vars.VITE_APP_API_HOST }}

      - name: Build Windows
        if: matrix.os == 'windows-2022'
        run: |
          pnpm build:win
        env:
          npm_config_msvs_version: 2022
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=8192
          MAIN_VITE_MARKETAPI_CLIENT_SECRET: ${{ secrets.MAIN_VITE_MARKETAPI_CLIENT_SECRET }}
          MAIN_VITE_MINERU_API_KEY: ${{ secrets.MAIN_VITE_MINERU_API_KEY }}
          RENDERER_VITE_AIHUBMIX_SECRET: ${{ secrets.RENDERER_VITE_AIHUBMIX_SECRET }}
          RENDERER_VITE_PPIO_APP_SECRET: ${{ secrets.RENDERER_VITE_PPIO_APP_SECRET }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_USER_UI_HOST: ${{ vars.VITE_USER_UI_HOST }}
          VITE_WEB_UI_HOST: ${{ vars.VITE_WEB_UI_HOST }}
          VITE_APP_API_HOST: ${{ vars.VITE_APP_API_HOST }}

      - name: Release
        uses: ncipollo/release-action@v1
        with:
          draft: true
          allowUpdates: true
          makeLatest: false
          tag: ${{ steps.get-tag.outputs.tag }}
          artifacts: "dist/*.exe,dist/*.zip,dist/*.dmg,dist/*.AppImage,dist/*.snap,dist/*.deb,dist/*.rpm,dist/*.tar.gz,dist/latest*.yml,dist/rc*.yml,dist/beta*.yml,dist/*.blockmap"
          token: ${{ secrets.GITHUB_TOKEN }}
